<svg xmlns="http://www.w3.org/2000/svg" width="240" height="108" viewBox="0 0 240 108" shape-rendering="crispEdges">
  <!-- Fond provisoire (ciel + montagnes + sol), 240 x 108.
       Il est répété horizontalement : le bord gauche doit raccorder avec le bord droit.
       Le sol (là où le dino pose ses skis) est à 88 px du haut, soit 81,5 % de la hauteur :
       si vous changez d'image, réglez GROUND_LINE dans index.tsx. -->
  <!-- ciel -->
  <rect width="240" height="108" fill="#0b1e3f"/>
  <!-- étoiles -->
  <rect x="20" y="10" width="2" height="2" fill="#eef6ff"/>
  <rect x="75" y="22" width="1" height="1" fill="#eef6ff"/>
  <rect x="130" y="8" width="2" height="2" fill="#eef6ff"/>
  <rect x="190" y="18" width="1" height="1" fill="#eef6ff"/>
  <rect x="225" y="6" width="1" height="1" fill="#eef6ff"/>
  <!-- montagnes -->
  <polygon points="0,88 0,70 40,30 90,80 140,36 200,84 240,70 240,88" fill="#24497a"/>
  <!-- neige sur les sommets -->
  <polygon points="40,30 31,39 49,39" fill="#eef6ff"/>
  <polygon points="140,36 131,45 149,45" fill="#eef6ff"/>
  <!-- sol enneigé -->
  <rect y="88" width="240" height="20" fill="#eef6ff"/>
  <!-- traces dans la neige -->
  <rect x="10" y="96" width="12" height="2" fill="#7fb4de"/>
  <rect x="70" y="100" width="12" height="2" fill="#7fb4de"/>
  <rect x="130" y="96" width="12" height="2" fill="#7fb4de"/>
  <rect x="190" y="100" width="12" height="2" fill="#7fb4de"/>
</svg>
